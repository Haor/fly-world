name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix fly-host
      - run: npm ci --prefix cloud
      - run: node --test fly-host/tests/*.test.js
      - run: npm test --prefix cloud
      - run: node fly-host/tests/data-integrity.mjs
      - run: npm run build --prefix fly-host
      - run: python -m pip install -r cloud/requirements-build.txt
      - run: python -m unittest discover -s cloud/tests -p 'test_*.py'
      - run: python -m pip install -r cloud/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
      - run: python cloud/tools/check-torch.py --device cpu
      - shell: bash
        run: TORCH_TEST_PYTHON="$(python -c 'import sys; print(sys.executable)')" node --test cloud/tests/python-session.test.js
      - run: docker build -f cloud/Dockerfile -t fly-world-neural:ci .
        if: runner.os == 'Linux'
